<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platform Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Tenor+Sans&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  .admin-bar{display:flex; align-items:center; gap:12px; max-width:760px; margin:0 auto 22px; padding-bottom:14px; border-bottom:1px solid var(--border);}
  .admin-bar .title{margin-right:auto; font-family:var(--font-display, 'Tenor Sans'), sans-serif; letter-spacing:.08em; text-transform:uppercase; font-size:13px;}
  .admin-bar .who{font-size:12.5px; color:var(--text-muted);}
  .admin-bar form{margin:0;}
  .cust{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); margin-bottom:12px;}
  .cust-head{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:12px 14px; cursor:pointer;}
  .cust-head .name{font-weight:600; font-size:15px; margin-right:auto;}
  .cust.off{opacity:.6;}
  .cust-body{border-top:1px solid var(--border); padding:14px; display:flex; flex-direction:column; gap:16px; background:var(--surface-2);}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-grid .wide{grid-column:1 / -1;}
  .form-actions{display:flex; flex-wrap:wrap; gap:8px;}
  .site{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); padding:12px 14px; display:flex; flex-direction:column; gap:10px;}
  .site-head{display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
  .site-head .name{font-weight:600; margin-right:auto;}
  .facts{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px;}
  .facts dt{color:var(--text-muted);} .facts dd{margin:0;}
  .track{display:inline-block; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; padding:2px 8px; border-radius:99px; border:1px solid var(--border-strong);}
  .track-batch{color:var(--good); border-color:var(--good-soft-line); background:var(--good-soft);}
  .track-serial, .track-both{color:var(--accent-strong); border-color:var(--accent-soft-line); background:var(--accent-soft);}
  .track-none{color:var(--text-muted);}
  .track-unknown{color:var(--warn); border-color:var(--warn-soft-line);}
  .warn-note{color:var(--danger); font-size:13px;}
  .wh-list{font-size:12.5px; color:var(--text-muted); columns:2; column-gap:20px;}
  .log{font-size:13px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); max-height:360px; overflow:auto;}
  .log div{padding:7px 12px; border-top:1px solid var(--border); display:grid; grid-template-columns:120px 1fr; gap:10px;}
  .log div:first-child{border-top:0;}
  .log time{color:var(--text-faint);}
  @media (max-width:640px){ .form-grid{grid-template-columns:1fr;} .wh-list{columns:1;} .log div{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="admin-bar">
  <span class="title">Production Platform · Admin</span>
  <span class="who" id="who"></span>
  <form method="post" action="/admin/logout"><button type="submit" class="btn-ghost btn-small">Sign out</button></form>
</div>
<div class="wrap">
  <div class="error-banner" id="errorBanner" hidden></div>

  <form class="card card-pad" id="pwForm" hidden>
    <div class="section-title">Choose your password</div>
    <div class="export-note" style="margin:-4px 0 12px;">You signed in with a one-time password. Choose your own (at least 8 characters).</div>
    <div class="form-grid">
      <div class="field"><label for="pw1">New password</label><input id="pw1" type="password" autocomplete="new-password" required></div>
      <div class="field"><label for="pw2">Again</label><input id="pw2" type="password" autocomplete="new-password" required></div>
    </div>
    <div class="form-actions" style="margin-top:12px;"><button type="submit" class="btn-primary btn-small">Save password</button></div>
  </form>

  <div id="main" hidden>
    <div class="page-head">
      <div class="eyebrow">Production Platform</div>
      <h1>Customers</h1>
      <div class="sub">Each customer, with its sites. A site is one Unleashed account.</div>
    </div>
    <div id="customerList"></div>
    <div class="form-actions" style="margin-bottom:20px;"><button type="button" class="btn-primary btn-small" id="addCustomerBtn">Add a customer</button></div>
    <div id="newCustomer"></div>

    <div class="card card-pad">
      <div class="section-title">Admin activity</div>
      <div class="log" id="activityList"></div>
    </div>
  </div>
</div>
<script type="module" src="/admin/admin.js"></script>
</body>
</html>
